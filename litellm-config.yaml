model_list:
  # ─── Anthropic ────────────────────────────────────────────────────────────
  - model_name: claude-code          # used by orchestrator for coding tasks
    litellm_params:
      model: anthropic/claude-sonnet-4-5
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-fast          # fast responses, lower cost
    litellm_params:
      model: anthropic/claude-haiku-3-5
      api_key: os.environ/ANTHROPIC_API_KEY

  # ─── Google Gemini ────────────────────────────────────────────────────────
  - model_name: gemini-pro           # complex reasoning, large context
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-flash         # fast + cheap, code tasks
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-flash-free    # same model, free-tier key pool
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY

  # ─── OpenRouter (auto-routing) ────────────────────────────────────────────
  - model_name: openrouter-auto      # auto-selects best model by cost+quality
    litellm_params:
      model: openrouter/openai/gpt-5.1
      api_key: os.environ/OPENROUTER_API_KEY

  # ─── OpenRouter free-tier models (:free suffix = $0) ─────────────────────
  - model_name: openrouter-vision-free  # Free multimodal model for GUI grounding & computer use
    litellm_params:
      model: openrouter/google/gemini-2.0-flash-exp:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: openrouter-deepseek-free
    litellm_params:
      model: openrouter/deepseek/deepseek-r1:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: openrouter-llama-free
    litellm_params:
      model: openrouter/meta-llama/llama-3.3-70b-instruct:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: openrouter-qwen-free
    litellm_params:
      model: openrouter/qwen/qwen3-235b-a22b:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: openrouter-mistral-free
    litellm_params:
      model: openrouter/mistralai/mistral-small-3.1-24b-instruct:free
      api_key: os.environ/OPENROUTER_API_KEY

  # ─── DeepSeek ─────────────────────────────────────────────────────────────
  - model_name: deepseek-code        # code-focused, very low cost
    litellm_params:
      model: deepseek/deepseek-coder
      api_key: os.environ/DEEPSEEK_API_KEY

  # ─── OpenAI ───────────────────────────────────────────────────────────────
  - model_name: gpt-main
    litellm_params:
      model: openai/gpt-4.1
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-mini
    litellm_params:
      model: openai/gpt-4.1-mini
      api_key: os.environ/OPENAI_API_KEY

  # ─── NVIDIA NIM ───────────────────────────────────────────────────────────
  - model_name: nvidia-llama
    litellm_params:
      model: nvidia_nim/meta/llama-3.3-70b-instruct
      api_key: os.environ/NVIDIA_API_KEY

  # ─── Vertex AI ────────────────────────────────────────────────────────────
  - model_name: vertex-gemini
    litellm_params:
      model: vertex_ai/gemini-2.0-flash-001
      api_key: os.environ/VERTEX_AI_API_KEY

  # ─── OmniRoute (gateway local — auto-roteamento entre provedores grátis) ──
  # Upstream openai-compatible rodando no host (porta 20128). O LiteLLM roda em
  # Docker, por isso usa host.docker.internal em vez de localhost.
  # Roteadores `auto/*` do OmniRoute estão com o pool de provedores esgotado
  # (testes: 400 "Invalid model" e 503 "Maximum combo retry limit reached" em
  # auto/chat, auto/cheap, auto/fast, auto/best-coding; só `kr/auto` — Kiro
  # free — responde 200). Todos os aliases apontam para kr/auto até que
  # provedores free sejam conectados no dashboard do OmniRoute.
  - model_name: omniroute-auto        # melhor modelo geral disponível (auto)
    litellm_params:
      model: openai/kr/auto           # prefixo openai/ => api_base próprio
      api_key: os.environ/OMNIROUTE_API_KEY
      api_base: http://host.docker.internal:20128/v1

  - model_name: omniroute-fast        # resposta rápida, custo zero
    litellm_params:
      model: openai/kr/auto
      api_key: os.environ/OMNIROUTE_API_KEY
      api_base: http://host.docker.internal:20128/v1

  - model_name: omniroute-code        # melhor modelo de código disponível
    litellm_params:
      model: openai/kr/auto
      api_key: os.environ/OMNIROUTE_API_KEY
      api_base: http://host.docker.internal:20128/v1

  - model_name: omniroute-free        # alias explícito de "só gratuitos"
    litellm_params:
      model: openai/kr/auto
      api_key: os.environ/OMNIROUTE_API_KEY
      api_base: http://host.docker.internal:20128/v1

  # ─── Cheaper Inference (pago — api.cheaperinference.com) ───────────────────
  # Provider pago para tarefas CRÍTICAS (orchestrator, coder, security, pentest).
  # Catálogo real verificado: 98 modelos; chave validada (GET /v1/models → 200).
  - model_name: cheaper-opus          # crítico — máxima qualidade
    litellm_params:
      model: openai/claude-opus-5.5
      api_key: os.environ/CHEAPER_INFERENCE_API_KEY
      api_base: https://api.cheaperinference.com/v1

  - model_name: cheaper-code          # crítico — código/arquitetura
    litellm_params:
      model: openai/claude-sonnet-5.5
      api_key: os.environ/CHEAPER_INFERENCE_API_KEY
      api_base: https://api.cheaperinference.com/v1

  - model_name: cheaper-fast          # crítico — respostas rápidas
    litellm_params:
      model: openai/claude-haiku-5.5
      api_key: os.environ/CHEAPER_INFERENCE_API_KEY
      api_base: https://api.cheaperinference.com/v1

  - model_name: cheaper-reason        # crítico — raciocínio longo
    litellm_params:
      model: openai/grok-4.7
      api_key: os.environ/CHEAPER_INFERENCE_API_KEY
      api_base: https://api.cheaperinference.com/v1

  - model_name: cheaper-vision        # visão barata (fallback visual)
    litellm_params:
      model: openai/gemini-3.8-flash
      api_key: os.environ/CHEAPER_INFERENCE_API_KEY
      api_base: https://api.cheaperinference.com/v1

router_settings:
  routing_strategy: cost-based-routing    # roteia pelo custo entre modelos equivalentes
  num_retries: 3
  retry_after: 5
  timeout: 120

litellm_settings:
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]
  cache: true
  cache_params:
    type: redis
    host: redis
    port: 6379

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  allow_user_auth: false            # no public signup — internal use only
  max_budget: 50.0                  # global monthly cap in USD
  budget_duration: 1mo

