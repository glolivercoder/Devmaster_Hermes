services:
  # ─── Hermes Core & Control Center ─────────────────────────────────────────
  hermes-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hermes-core
    env_file:
      - .env
    ports:
      - "4010:4010"    # Process Guardian API
      - "4020:4020"    # Event Bus / Web Dashboard
    environment:
      - NODE_ENV=production
      - LITELLM_BASE_URL=http://litellm:4000
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ALLOWED_CHAT_ID=${TELEGRAM_ALLOWED_CHAT_ID}
      - TELEGRAM_LLM_MODEL=${TELEGRAM_LLM_MODEL}
      - COMPOSIO_API_KEY=${COMPOSIO_API_KEY}
      - COMPOSIO_USER_ID=${COMPOSIO_USER_ID}
      # Gitea local (versionamento/backup). Dentro da rede Docker usa o nome do serviço.
      - GITEA_BASE_URL=http://gitea:3011
      - GITEA_TOKEN=${GITEA_TOKEN}
      - GITEA_OWNER=${GITEA_OWNER}
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./mcp-registry.json:/app/mcp-registry.json:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro  # Allows Hermes to manage Docker MCP containers on-demand
    depends_on:
      litellm:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M

  # ─── LiteLLM AI Gateway ───────────────────────────────────────────────────
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: hermes-litellm
    ports:
      - "4000:4000"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_API_KEY_ALT1=${GEMINI_API_KEY_ALT1}
      - GEMINI_API_KEY_ALT2=${GEMINI_API_KEY_ALT2}
      - GEMINI_API_KEY_ALT3=${GEMINI_API_KEY_ALT3}
      - GEMINI_API_KEY_ALT4=${GEMINI_API_KEY_ALT4}
      - GEMINI_API_KEY_ALT5=${GEMINI_API_KEY_ALT5}
      - GEMINI_API_KEY_ALT6=${GEMINI_API_KEY_ALT6}
      - GEMINI_API_KEY_ALT7=${GEMINI_API_KEY_ALT7}
      - GEMINI_API_KEY_ALT8=${GEMINI_API_KEY_ALT8}
      - GEMINI_API_KEY_ALT9=${GEMINI_API_KEY_ALT9}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_API_KEY_ALT1=${OPENROUTER_API_KEY_ALT1}
      - OPENROUTER_API_KEY_ALT2=${OPENROUTER_API_KEY_ALT2}
      - OPENROUTER_API_KEY_ALT3=${OPENROUTER_API_KEY_ALT3}
      - OPENROUTER_API_KEY_ALT4=${OPENROUTER_API_KEY_ALT4}
      - OPENROUTER_API_KEY_ALT5=${OPENROUTER_API_KEY_ALT5}
      - OPENROUTER_API_KEY_ALT6=${OPENROUTER_API_KEY_ALT6}
      - OPENROUTER_API_KEY_ALT7=${OPENROUTER_API_KEY_ALT7}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - OPENAI_API_KEY_ALT1=${OPENAI_API_KEY_ALT1}
      - OPENAI_API_KEY_ALT2=${OPENAI_API_KEY_ALT2}
      - OPENAI_API_KEY_ALT3=${OPENAI_API_KEY_ALT3}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - NVIDIA_BUILD_BASE_URL=${NVIDIA_BUILD_BASE_URL}
      - VERTEX_AI_API_KEY=${VERTEX_AI_API_KEY}
      - VERTEX_AI_BASE_URL=${VERTEX_AI_BASE_URL}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      # Chaves referenciadas por litellm-config.yaml via os.environ/...
      - CHEAPER_INFERENCE_API_KEY=${CHEAPER_INFERENCE_API_KEY}
      - OMNIROUTE_API_KEY=${OMNIROUTE_API_KEY}
      - DATABASE_URL=postgresql://hermes:${POSTGRES_PASSWORD}@postgres:5432/hermes_gateway
      - REDIS_URL=redis://redis:6379
      - LITELLM_LOG=WARNING
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1536M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─── PostgreSQL (LiteLLM Virtual Keys & Budget Tracking) ──────────────────
  postgres:
    image: postgres:16-alpine
    container_name: hermes-postgres
    ports:
      - "5434:5432"    # 5433 já ocupado pelo evolution_postgres neste host
    volumes:
      - hermes_pg_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=hermes
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=hermes_gateway
    command: postgres -c shared_buffers=128MB -c max_connections=40
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermes -d hermes_gateway"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis (Cache, Rate Limits & BullMQ Queues) ───────────────────────────
  redis:
    image: redis:7-alpine
    container_name: hermes-redis
    ports:
      - "6380:6379"    # 6379 já ocupado pelo evolution_redis neste host
    command: redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - hermes_redis_data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Gitea (versionamento local, endpoints/API e backup) ───────────────────
  # "GitHub básico" self-hosted: repos Git, API REST, webhooks, releases.
  # Usa SQLite embarcado para manter o setup leve (sem Postgres extra).
  # A UI do Hermes (aba Versionamento & Backup) consome a API REST via GITEA_*.
  gitea:
    image: gitea/gitea:1.22
    container_name: hermes-gitea
    environment:
      - USER_UID=1000
      - USER_GID=1000
      # Habilita escrita na API REST (necessário para o Hermes criar webhooks/backups)
      - GITEA__security__INSTALL_LOCK=true
      - GITEA__service__DISABLE_REGISTRATION=false
      - GITEA__api__ENABLE_SWAGGER=false
      - GITEA__server__SSH_PORT=2222
      - GITEA__server__HTTP_PORT=3000
      - GITEA__server__ROOT_URL=http://localhost:3011/
    ports:
      - "3011:3000"      # Web UI + API REST (porta 3011 no host, 3000 interna no container)
    volumes:
      - hermes_gitea_data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  hermes_pg_data:
  hermes_redis_data:
  hermes_gitea_data:
