model_list:
  # ─── Anthropic ────────────────────────────────────────────────────────────
  - model_name: claude-code          # used by orchestrator for coding tasks
    litellm_params:
      model: anthropic/claude-sonnet-4-5
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-fast          # fast responses, lower cost
    litellm_params:
      model: anthropic/claude-haiku-3-5
      api_key: os.environ/ANTHROPIC_API_KEY

  # ─── Google Gemini ────────────────────────────────────────────────────────
  - model_name: gemini-pro           # complex reasoning, large context
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-flash         # fast + cheap, code tasks
    litellm_params:
      model: gemini/gemini-2.0-flash
      api_key: os.environ/GEMINI_API_KEY

  # ─── OpenRouter (auto-routing) ────────────────────────────────────────────
  - model_name: openrouter-auto      # auto-selects best model by cost+quality
    litellm_params:
      model: openrouter/openai/gpt-5.1
      api_key: os.environ/OPENROUTER_API_KEY

  # ─── OpenRouter Vision / Free Computer Use ────────────────────────────────
  - model_name: openrouter-vision-free  # Free multimodal model for GUI grounding & computer use
    litellm_params:
      model: openrouter/google/gemini-2.0-flash-exp:free
      api_key: os.environ/OPENROUTER_API_KEY

  # ─── DeepSeek ─────────────────────────────────────────────────────────────
  - model_name: deepseek-code        # code-focused, very low cost
    litellm_params:
      model: deepseek/deepseek-coder
      api_key: os.environ/DEEPSEEK_API_KEY

router_settings:
  routing_strategy: cost-based-shuffling   # pick cheapest among equally capable
  num_retries: 3
  retry_after: 5
  timeout: 120

litellm_settings:
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]
  cache: true
  cache_params:
    type: redis
    host: redis
    port: 6379

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  allow_user_auth: false            # no public signup — internal use only
  max_budget: 50.0                  # global monthly cap in USD
  budget_duration: 1mo

